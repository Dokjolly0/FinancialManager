# Production overrides. Only the API and the web dashboard are published
# on the host (on loopback, behind the host's Caddy); PostgreSQL, Redis,
# and MinIO remain reachable only on backend_internal.

services:
  api:
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_HOST_PORT:-10003}:8080"
    environment:
      APP_ENV: production
    restart: unless-stopped

  worker:
    environment:
      APP_ENV: production
      # Off-site backups are on by default in production. If the Drive
      # credentials or encryption key are missing, the worker still runs its
      # other jobs and logs backup_not_configured on every hourly check. Set
      # BACKUP_ENABLED=false in .env to opt out explicitly.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  object-storage:
    restart: unless-stopped

  # The web dashboard: the Flutter app built for the browser and served by
  # Caddy (financial-manager-app/Dockerfile). Defined only here so the dev
  # stack doesn't compile Flutter; `up -d --build` rebuilds it with the
  # backend. It talks to the API through the browser, not over Docker
  # networks: it is on compose's default network only, never on
  # backend_internal.
  web:
    build:
      context: ../financial-manager-app
      args:
        API_BASE_URL: ${WEB_API_BASE_URL:-https://financialmanager.alexviolatto.dev/api/v1}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-10005}:8080"
    restart: unless-stopped
