openapi: 3.1.0
info:
  title: FinancialManager API
  version: "1"
  description: >
    REST API for the FinancialManager app (plan.md section 14). This
    document grows alongside each backend module as it is implemented —
    coverage today is partial: platform/health endpoints, plus the
    meal-voucher surface of the wallets/transactions modules
    (plan.md section 4.1, 11.6, 11.14, 11.15, 14.4, 14.5). The rest of
    wallets/transactions (plain CRUD, standard transactions, transfers,
    balance adjustments) predates this file and isn't documented here yet.
servers:
  - url: /v1

# Every route requires the access token except the health probes, which
# opt out with an empty security list.
security:
  - bearerAuth: []

paths:
  /wallets/{id}/voucher-lots:
    get:
      summary: List every lot (active and expired history) for a MEAL_VOUCHER wallet.
      operationId: getWalletVoucherLots
      tags: [vouchers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lots, oldest expires_at first. The client buckets them into active/expiring-soon/expired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  voucher_lots:
                    type: array
                    items: { $ref: "#/components/schemas/VoucherLot" }
        "403":
          description: The wallet isn't type MEAL_VOUCHER.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallets/{id}/voucher-credits:
    post:
      summary: Add (positive quantity) or remove (negative) vouchers outside of a purchase.
      operationId: createVoucherCredit
      tags: [vouchers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherCreditRequest" }
      responses:
        "201":
          description: The new/adjusted credit transaction and the wallet's updated balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { $ref: "#/components/schemas/Transaction" }
                  wallet: { $ref: "#/components/schemas/Wallet" }
        "422":
          description: Validation error, e.g. removing more vouchers than are available (field code VOUCHER_INSUFFICIENT_BALANCE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallets/{id}/voucher-credits/{creditId}:
    patch:
      summary: Edit a previously created voucher credit/removal's quantity and/or date.
      operationId: updateVoucherCredit
      tags: [vouchers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: creditId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVoucherCreditRequest" }
      responses:
        "200":
          description: The updated transaction and the wallet's updated balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { $ref: "#/components/schemas/Transaction" }
                  wallet: { $ref: "#/components/schemas/Wallet" }

  /voucher-expenses:
    post:
      summary: Record a purchase paid partly or fully with meal vouchers.
      operationId: createVoucherExpense
      tags: [vouchers]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherExpenseRequest" }
      responses:
        "201":
          description: >
            The voucher-wallet leg (and, if the vouchers didn't cover the
            full expense, the other-wallet leg), with both wallets' updated
            balances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoucherExpenseResult" }
        "422":
          description: >
            Validation error — insufficient vouchers (VOUCHER_INSUFFICIENT_BALANCE),
            a missing/unneeded other_wallet_id (OTHER_WALLET_REQUIRED /
            OTHER_WALLET_NOT_ALLOWED), or the usual field checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /voucher-expenses/{id}:
    patch:
      summary: Edit a voucher expense's quantity, real cost, difference wallet, and/or date.
      operationId: updateVoucherExpense
      tags: [vouchers]
      description: >
        [id] is always the voucher-wallet leg's transaction id, never the
        optional other-wallet leg's. Internally reverses the expense's
        prior lot consumption and shortfall-leg effect, then recomputes
        from scratch against the wallet's current lots and the new inputs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherExpenseRequest" }
      responses:
        "200":
          description: Same shape as creation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoucherExpenseResult" }

  /ai/settings:
    get:
      summary: AI analysis settings, stored providers (keys masked), consent and setup checklist.
      description: >
        Available on every server. When AI_KEY_ENCRYPTION_KEY is not set the
        response has available=false and every other /ai route answers 503
        AI_DISABLED (plan.md section 32.5).
      operationId: getAiSettings
      tags: [ai]
      responses:
        "200":
          description: Current settings. API keys are never returned, only key_hint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettings" }
    put:
      summary: Save the provider, model and analysis defaults, and make that provider active.
      description: >
        Upserts the stored credential for (provider, base_url). api_key
        omitted or null keeps the stored key, "" removes it, any other value
        replaces it. A provider other than openai_compatible must end up
        with a key.
      operationId: saveAiSettings
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsRequest" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettings" }
        "409":
          description: version is stale (CONFLICT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation error. Field codes include AI_PROVIDER_INVALID,
            AI_BASE_URL_INVALID (not https, credentials, query or fragment),
            AI_BASE_URL_NOT_ALLOWED (private or reserved address, or not in
            AI_ALLOWED_BASE_URL_HOSTS), REQUIRED_FIELD (model, api_key),
            AI_TEXT_TOO_LONG and VALUE_OUT_OF_RANGE (max_output_tokens).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: AI_DISABLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/settings/test:
    post:
      summary: Check a provider configuration with the cheapest possible call.
      description: >
        With an empty body the active configuration is tested. Otherwise
        missing fields fall back to the stored credential for that provider
        and base URL, so a form can be tested before saving. With a model a
        16-token completion is sent, otherwise the model list is fetched.
        Provider failures are reported in the body. Rate limited to 10 probes
        per 10 minutes, shared with /ai/models.
      operationId: testAiConnection
      tags: [ai]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiProbeRequest" }
      responses:
        "200":
          description: Result of the probe.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latency_ms: { type: integer }
                  model: { type: [string, "null"] }
                  error_code: { type: [string, "null"], description: "An AI_PROVIDER_* code." }
                  error_message: { type: [string, "null"], description: "The provider's explanation, truncated and redacted." }
        "409":
          description: AI_NOT_CONFIGURED (empty body and no active provider).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: RATE_LIMITED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/models:
    post:
      summary: List the provider's chat models.
      description: POST because the body may carry an API key. Same resolution and rate limit as /ai/settings/test.
      operationId: listAiModels
      tags: [ai]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiProbeRequest" }
      responses:
        "200":
          description: At most 500 models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        display_name: { type: string }
        "502":
          description: An AI_PROVIDER_* error (429 for AI_PROVIDER_RATE_LIMITED, 504 for AI_PROVIDER_TIMEOUT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/credentials/{id}:
    delete:
      summary: Forget a stored provider and its key. If it was active, no provider is active afterwards.
      operationId: deleteAiCredential
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/consent:
    put:
      summary: Accept the AI analysis disclosure.
      operationId: acceptAiConsent
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_version]
              properties:
                consent_version:
                  type: integer
                  description: Must equal consent.current_version from GET /ai/settings.
      responses:
        "204":
          description: Accepted.
        "422":
          description: AI_CONSENT_VERSION_INVALID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Revoke consent. Analyses are refused until it is accepted again.
      operationId: revokeAiConsent
      tags: [ai]
      responses:
        "204":
          description: Revoked.

  /ai/context:
    get:
      summary: The personal context sent to the model (version 0 when never saved).
      operationId: getAiContext
      tags: [ai]
      responses:
        "200":
          description: The context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUserContext" }
    put:
      summary: Replace the personal context. Blank text is stored as null.
      operationId: saveAiContext
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiUserContext" }
      responses:
        "200":
          description: The saved context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUserContext" }
        "409":
          description: version is stale (CONFLICT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: VALUE_OUT_OF_RANGE, INVALID_VALUE or AI_TEXT_TOO_LONG.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/presets:
    get:
      summary: Analysis presets in the user's language, with their default instructions and data sections.
      operationId: listAiPresets
      tags: [ai]
      responses:
        "200":
          description: Presets in display order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/AiPreset" }
        "503":
          description: AI_DISABLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/analyses/preview:
    post:
      summary: Build the exact prompt an analysis would send, without sending it.
      description: >
        The server always rebuilds the data from the database; only the
        instructions are taken from the client. Send data_fingerprint back
        when running the analysis: if the data changed in between the run
        answers 409 AI_DATA_CHANGED (plan.md section 32.4).
      operationId: previewAiAnalysis
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalysisRequest" }
      responses:
        "200":
          description: The prompt and what it discloses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiPreview" }
        "403":
          description: AI_CONSENT_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: AI_NOT_CONFIGURED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation error (preset, period, timezone, wallet_ids
            WALLET_NOT_FOUND, options.sections, options.max_transactions,
            instructions REQUIRED_FIELD or AI_TEXT_TOO_LONG), or
            AI_PROMPT_TOO_LARGE when the estimate exceeds AI_MAX_PROMPT_TOKENS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /health/live:
    get:
      summary: Liveness probe. Never depends on external services.
      operationId: getHealthLive
      tags: [health]
      security: []
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [live]
  /health/ready:
    get:
      summary: Readiness probe. Checks PostgreSQL and Redis connectivity.
      operationId: getHealthReady
      tags: [health]
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
        "503":
          description: One or more dependencies are unavailable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the auth endpoints (plan.md section 15).

  schemas:
    # Only the fields the voucher endpoints' payloads need — not a full
    # retroactive spec of the wallet/transaction resources (see the top-level
    # description). type is CASH/BANK/OTHER/MEAL_VOUCHER; the voucher_* fields
    # are only present when type=MEAL_VOUCHER (plan.md section 11.6).
    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string }
        current_balance_minor: { type: integer, format: int64 }
        type: { type: string, enum: [CASH, BANK, OTHER, MEAL_VOUCHER] }
        icon: { type: string }
        color: { type: string }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        purpose:
          type: [string, "null"]
          maxLength: 280
          description: >
            What the wallet is for, written by the user (plan.md section
            32.3). Read by the AI analysis. Blank input is stored as null;
            PATCH /wallets/{id} replaces it like the other fields.
        voucher_unit_value_minor:
          type: integer
          format: int64
          description: Fixed face value of one voucher, in minor currency units. Immutable after creation.
        voucher_expiry_cutoff_month: { type: integer, minimum: 1, maximum: 12 }
        voucher_expiry_month: { type: integer, minimum: 1, maximum: 12 }
        voucher_expiry_day: { type: integer, minimum: 1, maximum: 31 }
        voucher_expiring_soon_count:
          type: integer
          description: Active lots expiring within 30 days. Only populated by list/get, not by mutation responses.

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        direction: { type: string, enum: [CREDIT, DEBIT] }
        kind: { type: string, enum: [STANDARD, OPENING_BALANCE, BALANCE_ADJUSTMENT, TRANSFER] }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        title: { type: string }
        occurred_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        linked_transaction_id:
          type: string
          format: uuid
          description: Pairs a voucher expense's two STANDARD legs. Null on a fully-covered expense.
        system_generated:
          type: boolean
          description: True only for the automatic "vouchers expired" write-off — never user-created or user-editable.

    VoucherLot:
      type: object
      properties:
        id: { type: string, format: uuid }
        quantity_total: { type: integer }
        quantity_remaining: { type: integer }
        quantity_expired: { type: integer }
        expires_at: { type: string, format: date }
        created_by_transaction_id: { type: string, format: uuid }
        expired_by_transaction_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    VoucherCreditRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          description: Positive to add vouchers (creates a lot), negative to remove them (consumed FIFO by expiry).
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    UpdateVoucherCreditRequest:
      type: object
      required: [quantity, version]
      properties:
        quantity:
          type: integer
          description: New absolute quantity (always positive) — the sign/direction can't change on edit.
        reason: { type: string }
        occurred_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }

    VoucherExpenseRequest:
      type: object
      required: [voucher_wallet_id, voucher_quantity, total_expense_minor, title]
      properties:
        voucher_wallet_id: { type: string, format: uuid }
        voucher_quantity: { type: integer }
        total_expense_minor:
          type: integer
          format: int64
          description: The real cost. May be less than voucher_quantity × voucher_unit_value_minor — the excess is lost, never refunded.
        other_wallet_id:
          type: string
          format: uuid
          description: Required iff the vouchers' value falls short of total_expense_minor; forbidden otherwise.
        title: { type: string }
        occurred_at: { type: string, format: date-time }
        version:
          type: integer
          format: int64
          description: Required on PATCH /voucher-expenses/{id} only — the voucher-wallet leg's version.

    VoucherExpenseResult:
      type: object
      properties:
        voucher_transaction: { $ref: "#/components/schemas/Transaction" }
        other_transaction:
          allOf: [{ $ref: "#/components/schemas/Transaction" }]
          description: Present only when the vouchers didn't cover the full expense.
        voucher_wallet: { $ref: "#/components/schemas/Wallet" }
        other_wallet: { $ref: "#/components/schemas/Wallet" }

    AiProvider:
      type: string
      enum: [anthropic, openai, gemini, openai_compatible]

    AiCredential:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/AiProvider" }
        base_url: { type: [string, "null"], description: "Only for openai_compatible." }
        model: { type: [string, "null"] }
        has_key: { type: boolean }
        key_hint: { type: [string, "null"], description: "Masked key, e.g. sk-…a1b2." }
        last_tested_at: { type: [string, "null"], format: date-time }
        last_test_ok: { type: [boolean, "null"] }

    AiSettings:
      type: object
      properties:
        available: { type: boolean }
        active:
          oneOf:
            - { $ref: "#/components/schemas/AiCredential" }
            - { type: "null" }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/AiCredential" }
        max_output_tokens: { type: integer, minimum: 256, maximum: 32000 }
        input_price_per_mtok: { type: [number, "null"], description: "User-entered price per million input tokens." }
        output_price_per_mtok: { type: [number, "null"] }
        defaults:
          type: object
          properties:
            include_transactions: { type: boolean }
            anonymize_titles: { type: boolean }
        consent:
          type: object
          properties:
            accepted_version: { type: [integer, "null"] }
            current_version: { type: integer }
            accepted_at: { type: [string, "null"], format: date-time }
            required: { type: boolean }
        setup:
          type: object
          description: Drives the app's setup checklist.
          properties:
            has_provider: { type: boolean }
            has_model: { type: boolean }
            has_context: { type: boolean }
            wallets_total: { type: integer }
            wallets_with_purpose: { type: integer }
            analyses_count: { type: integer }
        version: { type: integer, format: int64 }

    AiSettingsRequest:
      type: object
      required: [provider, model, max_output_tokens]
      properties:
        provider: { $ref: "#/components/schemas/AiProvider" }
        base_url: { type: string, description: "Required for openai_compatible, e.g. https://api.mistral.ai/v1." }
        model: { type: string, maxLength: 200 }
        api_key:
          type: [string, "null"]
          maxLength: 512
          description: Omitted or null keeps the stored key; "" removes it.
        max_output_tokens: { type: integer, minimum: 256, maximum: 32000 }
        input_price_per_mtok: { type: [number, "null"], minimum: 0 }
        output_price_per_mtok: { type: [number, "null"], minimum: 0 }
        defaults:
          type: object
          properties:
            include_transactions: { type: boolean }
            anonymize_titles: { type: boolean }
        version: { type: integer, format: int64, description: "0 on the first save." }

    AiProbeRequest:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/AiProvider" }
        base_url: { type: string }
        api_key: { type: string }
        model: { type: string }

    AiUserContext:
      type: object
      properties:
        household_size: { type: [integer, "null"], minimum: 1, maximum: 20 }
        income_type:
          type: [string, "null"]
          enum: [EMPLOYEE, SELF_EMPLOYED, STUDENT, RETIRED, UNEMPLOYED, MIXED, OTHER, null]
        about_me: { type: [string, "null"], maxLength: 2000 }
        goals: { type: [string, "null"], maxLength: 2000 }
        ignore_notes: { type: [string, "null"], maxLength: 2000 }
        response_style: { type: [string, "null"], enum: [CONCISE, DETAILED, null] }
        version: { type: integer, format: int64, description: "0 when never saved; send it back on PUT." }
        updated_at: { type: [string, "null"], format: date-time, readOnly: true }

    AiDataSection:
      type: string
      description: Optional data sections. Period, wallets and totals are always sent.
      enum: [monthly, categories, titles, transfers, recurring, personal_context]

    AiPreset:
      type: object
      properties:
        id: { type: string, enum: [MONTHLY_CHECKUP, ANOMALIES, SAVINGS, RECURRING, WALLET_PURPOSE, CUSTOM] }
        title: { type: string }
        description: { type: string }
        default_instructions: { type: string, description: "Empty for CUSTOM." }
        default_sections:
          type: array
          items: { $ref: "#/components/schemas/AiDataSection" }
        default_include_transactions: { type: boolean }
        default_period_preset: { type: string }

    AiAnalysisRequest:
      type: object
      required: [preset]
      properties:
        preset: { type: string }
        period:
          type: object
          properties:
            preset:
              type: string
              enum: [last_30_days, last_12_months, all_time, current_month, current_year, custom]
              default: last_12_months
            from: { type: string, description: "custom only: YYYY-MM-DD (or RFC3339)." }
            to: { type: string, description: "custom only, inclusive." }
        timezone: { type: string, description: "IANA name; defaults to the user's." }
        wallet_ids:
          type: array
          items: { type: string, format: uuid }
          description: Empty means every wallet, archived ones included.
        options:
          type: object
          properties:
            sections:
              type: array
              items: { $ref: "#/components/schemas/AiDataSection" }
            include_transactions: { type: boolean, default: false }
            max_transactions: { type: integer, minimum: 1, maximum: 500, default: 200 }
            anonymize_titles: { type: boolean, default: false }
            include_adjustments: { type: boolean, default: false }
        instructions:
          type: [string, "null"]
          maxLength: 4000
          description: Null uses the preset's default instructions; required for CUSTOM.

    AiPreview:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/AiProvider" }
        model: { type: string }
        prompt_version: { type: string }
        system_prompt: { type: string, description: "Read-only rules and report structure." }
        instructions: { type: string, description: "Editable; sent back on run." }
        data_block: { type: string, description: "Read-only data, between <financial_data> and optional <user_context> tags." }
        data_fingerprint: { type: string, description: "SHA-256 of the prompt version, system prompt and data block." }
        estimated_input_tokens: { type: integer, description: "Rough estimate (characters / 3.5)." }
        max_output_tokens: { type: integer }
        estimated_cost:
          type: [object, "null"]
          description: Only when the user entered prices; the output cost is an upper bound.
          properties:
            input_cost: { type: number }
            max_output_cost: { type: number }
        period_from: { type: [string, "null"], format: date }
        period_to: { type: string, format: date }
        disclosure:
          type: object
          properties:
            sections:
              type: array
              items: { $ref: "#/components/schemas/AiDataSection" }
            wallet_count: { type: integer }
            transaction_count: { type: integer }
            transactions_omitted: { type: integer }
            anonymized: { type: boolean }
            includes_personal_context: { type: boolean }

    Error:
      type: object
      description: Uniform error envelope (plan.md section 10.6).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field_errors:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
