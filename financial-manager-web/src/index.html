<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Financial Manager</title>
    <!-- The dashboard is served from the root of financialmanager.alexviolatto.dev. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gestione delle finanze personali: portafogli, movimenti, report e analisi AI."
    />
    <meta name="theme-color" content="#193366" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Financial Manager" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!-- No inline scripts or styles: the Content-Security-Policy forbids them
         (financial-manager-backend/deploy/Caddyfile.example). The loading
         screen is styled in styles.css and replaced once Angular renders. -->
    <app-root>
      <div class="boot-screen" aria-live="polite">
        <img src="icons/Icon-192.png" alt="" width="72" height="72" />
        <p>Financial Manager</p>
      </div>
    </app-root>
    <noscript>
      <p class="boot-noscript">Financial Manager richiede JavaScript attivo nel browser.</p>
    </noscript>
  </body>
</html>
