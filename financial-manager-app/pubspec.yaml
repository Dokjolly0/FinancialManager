name: financialmanager
description: "FinancialManager — gestione economica personale."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management and dependency injection (plan.md section 9.2).
  flutter_riverpod: ^3.3.2

  # Declarative routing with redirect-based auth guards (section 9.8).
  go_router: ^17.2.3

  # HTTP client: base URL per environment, interceptors, timeouts (section 9.5).
  dio: ^5.7.0

  # Secure storage for refresh tokens (Keychain/Keystore wrapper, section 9.2).
  flutter_secure_storage: ^10.3.1

  # Locale-aware date/number formatting (section 9.7, 17.3).
  intl: ^0.20.2

  # Client-generated correlation/idempotency keys (section 7.6, 9.5).
  uuid: ^4.5.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1

  # Report charts: andamento line, confronto mensile bars (section 7.12, 18).
  fl_chart: ^1.2.0

  # Downloaded data export: temp file + native share sheet (section 7.13 "Dati", 20.2).
  path_provider: ^2.1.5
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  gpt_markdown: ^1.3.4

  # On-device AI models (section 33): SHA-256 of downloaded files, and the
  # "Wi-Fi only" download rule.
  crypto: ^3.0.7
  connectivity_plus: ^7.3.2

  # On-device AI engines (section 33, docs/ai-on-device-spike.md): one API
  # over LiteRT-LM (.litertlm, GPU) and llama.cpp (GGUF, CPU); the screen
  # stays on while a model generates.
  flutter_edge_ai: ^2.5.0
  flutter_edge_ai_litertlm: ^1.16.0
  flutter_edge_ai_llama: ^0.0.2
  wakelock_plus: ^1.8.1

  # Importing a model file picked on the phone (section 33).
  file_picker: ^13.1.0

  # The last model picked for an AI analysis, per account (section 32.4).
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  flutter_local_notifications: 22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/ai/local_models.json

# Regenerate with `dart run flutter_launcher_icons` after editing
# assets/icon/icon.png or icon_foreground.png.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#193366"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# llamadart (behind flutter_edge_ai_llama) builds only the llama.cpp runtime
# (LiteRT-LM comes from flutter_edge_ai_litertlm) and, on Android, only the
# CPU backend: its Vulkan GPU path crashed on the Adreno of the reference
# phone, and libggml-vulkan.so alone adds 26 MB (docs/ai-on-device-spike.md).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64: [cpu]
