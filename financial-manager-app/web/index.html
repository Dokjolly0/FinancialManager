<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href`. The dashboard
    is served from the root of financialmanager.alexviolatto.dev, so it
    stays "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestione delle finanze personali: portafogli, movimenti, report e analisi AI.">
  <meta name="theme-color" content="#193366">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Financial Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Financial Manager</title>
  <link rel="manifest" href="manifest.json">

  <!-- cropperjs 1.6.2 (MIT, web/cropperjs/LICENSE) for image_cropper's web
       dialog. Served from here, not a CDN: no third-party requests and a
       strict Content-Security-Policy. -->
  <link rel="stylesheet" href="cropperjs/cropper.min.css">
  <script src="cropperjs/cropper.min.js"></script>

  <!-- Shown until Flutter draws its first frame. No inline styles or
       scripts: the Content-Security-Policy doesn't allow them. -->
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div id="loading" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <p>Caricamento di Financial Manager…</p>
  </div>
  <noscript>
    <p class="noscript">Financial Manager richiede JavaScript attivo nel browser.</p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
