name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "financial-manager-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "financial-manager-backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: financial-manager-backend

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Uses go.mod's toolchain directive (the latest patch release, with
      # the standard library's security fixes), not the go directive,
      # which is only the minimum version.
      - uses: actions/setup-go@v7
        with:
          go-version-file: financial-manager-backend/go.mod
          cache-dependency-path: financial-manager-backend/go.sum

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@latest lint openapi/openapi.yaml

  docker-build:
    runs-on: ubuntu-26.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build --build-arg TARGET=api -t financial-manager-api:ci .
        working-directory: financial-manager-backend

      - name: Build worker image
        run: docker build --build-arg TARGET=worker -t financial-manager-worker:ci .
        working-directory: financial-manager-backend

      # trivy-action is pinned to a commit, not a tag: a tag can be moved to
      # other code (it happened to this action's tags in 2026), a commit
      # can't.
      # plan.md section 19.8: "Scansione vulnerabilità... immagini Docker".
      # Fails the build on HIGH/CRITICAL findings; a base-image CVE isn't
      # something app code can wait out until the next unrelated release.
      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: financial-manager-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: financial-manager-worker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
