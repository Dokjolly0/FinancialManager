name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - "financial-manager-app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "financial-manager-app/**"
      - ".github/workflows/mobile-ci.yml"
  # Reruns the checks and builds by hand.
  workflow_dispatch:

defaults:
  run:
    working-directory: financial-manager-app

jobs:
  analyze-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  build-android:
    runs-on: ubuntu-26.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # The on-device AI engines (plan.md section 33) add most of the APK's
      # native code; the size report keeps an eye on it (~92 MB in Oct 2026).
      - name: Build release APK (arm64) with size analysis
        run: flutter build apk --release --target-platform android-arm64 --analyze-size

  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build unsigned iOS debug app
        run: flutter build ios --no-codesign --debug
