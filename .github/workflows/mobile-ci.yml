name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - "financial-manager-app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "financial-manager-app/**"
      - ".github/workflows/mobile-ci.yml"
  # Republishes the web dashboard image by hand (e.g. after adding the
  # Docker Hub secrets, or to rebuild on a new base image).
  workflow_dispatch:

defaults:
  run:
    working-directory: financial-manager-app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # The on-device AI engines (plan.md section 33) add most of the APK's
      # native code; the size report keeps an eye on it (~92 MB in Oct 2026).
      - name: Build release APK (arm64) with size analysis
        run: flutter build apk --release --target-platform android-arm64 --analyze-size

  # The web dashboard image (financial-manager-app/Dockerfile, plan.md
  # section 21). Every run compiles it, so an import that doesn't build for
  # the browser (dart:ffi, native-only plugins) fails CI. On main (push or
  # manual run) it is also published to Docker Hub, and the VPS only pulls
  # it: compiling Flutter there doesn't fit in 2 GB of RAM
  # (docs/build-deploy.md, "Dashboard web").
  #
  # Tags: latest (what compose.prod.yaml runs by default) and
  # sha-<commit> (never moves; WEB_IMAGE_TAG pins it for a rollback).
  # Secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub access
  # token with Read & Write permission).
  build-web:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      IMAGE: dokjolly/financial-manager-web
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The VPS is amd64; the API URL is the Dockerfile's default
      # (https://financialmanager.alexviolatto.dev/api/v1).
      - uses: docker/build-push-action@v6
        with:
          context: financial-manager-app
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build unsigned iOS debug app
        run: flutter build ios --no-codesign --debug
